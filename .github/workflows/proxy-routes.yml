name: Proxy routes

# The webview http_request proxy (src/core/package/proxy-scope.ts) rejects any
# view-server route it does not recognize. This job installs the latest
# inspect-ai and inspect-scout releases, dumps the routes they serve, and checks
# every one against that table. It runs on pull requests that touch the route
# table or the checker. The nightly check against new upstream releases is the
# inspect_vscode canary in meridianlabs-ai/canaries, which runs the same route
# check.

on:
  pull_request:
    paths:
      - "src/core/package/proxy-scope.ts"
      - "scripts/proxy-routes/**"
      - ".github/workflows/proxy-routes.yml"

permissions:
  contents: read

jobs:
  check-routes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Not cached: this job runs the newest inspect-ai and inspect-scout
          # with no cooldown, so it must not save anything another job could
          # restore.

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install latest inspect-ai and inspect-scout
        run: |
          python -m pip install --upgrade pip
          python -m pip install inspect-ai inspect-scout
          python -m pip show inspect-ai inspect-scout | grep -E '^(Name|Version):'

      - name: Dump view-server routes
        run: python scripts/proxy-routes/dump-openapi.py --out out/proxy-routes

      - name: Compile proxy-scope
        run: pnpm compile-tests

      - name: Check routes against the proxy table
        run: node scripts/proxy-routes/check.mjs
