# The read-only reviewer for this repo, on demand only: comment @review on a
# PR to run it. Auto-review on PR open /
# ready_for_review is deliberately OFF (decision: Ransom, 2026-09-16: no
# unasked CI reviews in any Meridian repo; reviews are driven from Orca
# workspaces). The `pull_request` trigger this stub used to ship with was
# removed together with its `if` clause; the template in
# meridianlabs-ai/agents examples/claude-review-stub.yml keeps both as a
# commented-out block, so copy them back from there to restore auto-review.
# Independent of the dev agent (claude.yml) — different trigger, different
# (lower) permissions.
#
# Caveat: PRs from forks — @review on a fork PR works only when the commenter
# has write access; the reusable's trig check enforces it before checkout.

name: Review

on:
  issue_comment:
    types: [created]

jobs:
  review:
    # Run on a PR comment containing @review (works on drafts, and on fork
    # PRs when the commenter has write access — see the header). `@review` does not
    # collide with the dev agent's `@claude` trigger.
    if: >
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@review')
    uses: meridianlabs-ai/agents/.github/workflows/claude-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
