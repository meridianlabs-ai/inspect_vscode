name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish-tag:
        description: "Publish an existing release tag that failed to publish (e.g. v0.10.2). Leave empty for a normal Release Please run."
        type: string
        default: ""

jobs:
  # Release Please and the credential-free build of the .vsix.
  release:
    permissions:
      contents: write
      pull-requests: write
    uses: meridianlabs-ai/actions/.github/workflows/release-please-vscode.yml@40b7c888e3a8c34a083e8354099b18d1d7e936a0 # main
    with:
      publish-tag: ${{ inputs.publish-tag }}
    # Only the secrets the reusable workflow uses, not `secrets: inherit`, so
    # the other repository and organization secrets stay out of it.
    secrets:
      RELEASE_PLEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
      RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      SLACK_APPROVALS_WEBHOOK_URL: ${{ secrets.SLACK_APPROVALS_WEBHOOK_URL }}

  # Publish to the Marketplace and Open VSX, both with Trusted Publishing, so
  # the job uses no stored publish token. No .vsix is attached to the GitHub
  # release, so releases can be immutable. This job must live in this file,
  # not in the reusable workflow: each registry's trusted publisher for ukaisi
  # names this repo, release.yml and the `marketplace` environment, and the
  # Marketplace matches the workflow file the job itself comes from. It checks
  # out nothing and runs no repo code; the `marketplace` environment's
  # reviewers gate it.
  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write # Trusted Publishing (Marketplace and Open VSX)
    steps:
      - uses: meridianlabs-ai/actions/vscode-publish@40b7c888e3a8c34a083e8354099b18d1d7e936a0 # main
        with:
          extension-id: ukaisi.inspect-ai
          tag: ${{ needs.release.outputs.tag_name }}
