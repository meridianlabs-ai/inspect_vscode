name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      # The publish job exchanges a GitHub OIDC token for a Marketplace
      # credential (Trusted Publishing); no VSCE_PAT.
      id-token: write
    uses: meridianlabs-ai/actions/.github/workflows/release-please-vscode.yml@ec90091486f0f28545b56f4178a2c982fe8c8265 # main
    with:
      extension-id: ukaisi.inspect-ai
    # Only the secrets the reusable workflow uses, not `secrets: inherit`, so
    # the other repository and organization secrets stay out of it.
    secrets:
      RELEASE_PLEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
      RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      SLACK_APPROVALS_WEBHOOK_URL: ${{ secrets.SLACK_APPROVALS_WEBHOOK_URL }}
