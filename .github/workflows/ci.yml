name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-package:
    # Preserve the stable job names required by the repository ruleset.
    name: ${{ matrix.vscode == 'stable' && format('verify-package ({0})', matrix.os) || format('minimum-host ({0})', matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        vscode: ["1.93.0", "stable"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run TypeScript compiler
        run: pnpm build

      - name: Build extension
        run: pnpm build:production

      # VS Code's test runner needs a display. On Linux we provide a virtual
      # one via xvfb; the Windows runner already has a display.
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          REQUIRE_FISH_TESTS: "1"
          REQUIRE_PWSH_TESTS: "1"
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fish
          xvfb-run -a pnpm test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: pnpm test

      - name: Package extension
        run: pnpm vsce:package

      - name: Upload extension artifact
        # Only one OS needs to publish the .vsix artifact.
        if: runner.os == 'Linux' && matrix.vscode == 'stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: "*.vsix"
