version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
    open-pull-requests-limit: 5
    ignore:
      # Pin @types/vscode to the minimum supported VS Code version.
      # We don't want to force use of too new a version of VS Code.
      - dependency-name: "@types/vscode"

  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment; Dependabot
  # bumps both. The cooldown gives a compromised release time to be caught
  # before it is proposed; security updates skip it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR per week for every action update, majors included.
    groups:
      github-actions:
        patterns:
          - "*"
