version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a compromised
    # release has time to be caught. Security updates skip the cooldown;
    # it doesn't apply to transitive deps (dependabot-core#14683).
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: "development"
    open-pull-requests-limit: 5
    ignore:
      # Pin @types/vscode to the minimum supported VS Code version.
      # We don't want to force use of too new a version of VS Code.
      - dependency-name: "@types/vscode"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
